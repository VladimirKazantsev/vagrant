global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Nexus метрики — опционально (см. примечание ниже)
  # - job_name: "nexus"
  #   metrics_path: /service/metrics/prometheus
  #   static_configs:
  #     - targets: ["nexus:8081"]
