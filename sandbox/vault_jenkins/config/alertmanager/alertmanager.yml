global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname", "instance"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://127.0.0.1:1"   # заведомо недоступно, только чтобы валидно стартануть
        send_resolved: true